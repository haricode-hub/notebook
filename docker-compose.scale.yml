services:
  api:
    deploy:
      replicas: 3
    ports: !reset []
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: opennotebook
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-studio-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-studio-minio-change-me}
      S3_REGION: us-east-1
    depends_on:
      minio-init:
        condition: service_completed_successfully

  worker:
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: opennotebook
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-studio-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-studio-minio-change-me}
      S3_REGION: us-east-1
    depends_on:
      minio-init:
        condition: service_completed_successfully

  web:
    deploy:
      replicas: 3
    ports: !reset []

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-studio-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-studio-minio-change-me}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set studio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        (mc mb --ignore-existing studio/opennotebook)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-studio-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-studio-minio-change-me}

  web-proxy:
    image: nginx:1.27-alpine
    depends_on:
      web: { condition: service_healthy }
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro

  api-proxy:
    image: nginx:1.27-alpine
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./deploy/nginx-api.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  minio_data:
