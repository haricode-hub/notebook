[project]
name = "opennotebook-worker"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["opennotebook-core", "arq>=0.26"]

[tool.uv.sources]
opennotebook-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opennotebook_worker"]
