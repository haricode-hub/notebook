[project]
name = "opennotebook-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "opennotebook-core",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.15.1",
    "cryptography>=50.0.2",
    "python-multipart>=0.0.32",
]

[tool.uv.sources]
opennotebook-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opennotebook_api"]
