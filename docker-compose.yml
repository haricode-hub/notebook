services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
      POSTGRES_DB: ${POSTGRES_DB:-studio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studio} -d ${POSTGRES_DB:-studio}"]
      interval: 1s
      timeout: 2s
      retries: 60
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 60
    ports:
      - "6379:6379"

  embed:
    build:
      context: .
      dockerfile: Dockerfile.python
      target: embed
    environment:
      EMBED_BACKEND: ${EMBED_BACKEND:-gemma2}
      MULTIMODAL_ENABLED: ${MULTIMODAL_ENABLED:-false}
      MULTIMODAL_IMAGE_ENABLED: ${MULTIMODAL_IMAGE_ENABLED:-true}
      MULTIMODAL_AUDIO_ENABLED: ${MULTIMODAL_AUDIO_ENABLED:-false}
      MULTIMODAL_IMAGE_MAX_SOFT_TOKENS: ${MULTIMODAL_IMAGE_MAX_SOFT_TOKENS:-70}
      EMBED_DIM: ${EMBED_DIM:-768}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-8}
      EMBED_CONCURRENCY: ${EMBED_CONCURRENCY:-2}
      EMBED_CACHE_ENTRIES: ${EMBED_CACHE_ENTRIES:-512}
    volumes:
      - model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz', timeout=2)"]
      interval: 1s
      timeout: 2s
      retries: 60
    ports:
      - "8001:8001"

  tts:
    build:
      context: .
      dockerfile: apps/tts/Dockerfile
    environment:
      HF_HOME: /models
    volumes:
      - tts_model_cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.python
      target: api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio}@postgres:5432/${POSTGRES_DB:-studio}
      REDIS_URL: redis://redis:6379/0
      EMBED_URL: http://embed:8001
      EMBED_BACKEND: ${EMBED_BACKEND:-gemma2}
      MULTIMODAL_ENABLED: ${MULTIMODAL_ENABLED:-false}
      MULTIMODAL_IMAGE_ENABLED: ${MULTIMODAL_IMAGE_ENABLED:-true}
      MULTIMODAL_AUDIO_ENABLED: ${MULTIMODAL_AUDIO_ENABLED:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_PATH: /app/storage
      EMBED_DIM: ${EMBED_DIM:-768}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      CHAT_CONTEXT_TOKENS: ${CHAT_CONTEXT_TOKENS:-8192}
      CHAT_MAX_HISTORY: ${CHAT_MAX_HISTORY:-6}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-30}
      CHAT_TOKENS_PER_DAY: ${CHAT_TOKENS_PER_DAY:-100000}
      SOURCE_QUOTA_PER_USER: ${SOURCE_QUOTA_PER_USER:-250}
      CHAT_RERANK: ${CHAT_RERANK:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-kokoro}
      TTS_URL: http://tts:8002
      TTS_CONCURRENCY: ${TTS_CONCURRENCY:-1}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      JWKS_URL: http://web:3000/api/auth/jwks
      JWT_ISSUER: ${BETTER_AUTH_URL:-http://localhost:3000}
      JWT_AUDIENCE: opennotebook-api
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-}
      DEFAULT_CHEAP_MODEL: ${DEFAULT_CHEAP_MODEL:-}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-}
      JOB_MAX_TRIES: ${JOB_MAX_TRIES:-3}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      ORPHAN_FILE_GRACE_HOURS: ${ORPHAN_FILE_GRACE_HOURS:-24}
      ARTIFACT_MAP_MAX_BYTES: ${ARTIFACT_MAP_MAX_BYTES:-10000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      embed: { condition: service_healthy }
    volumes:
      - files_data:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)"]
      interval: 1s
      timeout: 2s
      retries: 60
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.python
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio}@postgres:5432/${POSTGRES_DB:-studio}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_PATH: /app/storage
      EMBED_URL: http://embed:8001
      EMBED_BACKEND: ${EMBED_BACKEND:-gemma2}
      MULTIMODAL_ENABLED: ${MULTIMODAL_ENABLED:-false}
      MULTIMODAL_IMAGE_ENABLED: ${MULTIMODAL_IMAGE_ENABLED:-true}
      MULTIMODAL_AUDIO_ENABLED: ${MULTIMODAL_AUDIO_ENABLED:-false}
      EMBED_DIM: ${EMBED_DIM:-768}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-8}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-kokoro}
      TTS_URL: http://tts:8002
      TTS_CONCURRENCY: ${TTS_CONCURRENCY:-1}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-}
      DEFAULT_CHEAP_MODEL: ${DEFAULT_CHEAP_MODEL:-}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-}
      JOB_MAX_TRIES: ${JOB_MAX_TRIES:-3}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      ORPHAN_FILE_GRACE_HOURS: ${ORPHAN_FILE_GRACE_HOURS:-24}
      ARTIFACT_MAP_MAX_BYTES: ${ARTIFACT_MAP_MAX_BYTES:-10000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      api: { condition: service_healthy }
      tts: { condition: service_healthy }
    volumes:
      - files_data:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; assert redis.Redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 1s
      timeout: 2s
      retries: 60

  auth-migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: auth-migrate
    environment:
      BETTER_AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio}@postgres:5432/${POSTGRES_DB:-studio}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      BETTER_AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio}@postgres:5432/${POSTGRES_DB:-studio}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      api: { condition: service_healthy }
      auth-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 2s
      retries: 60
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  files_data:
  model_cache:
  tts_model_cache:
