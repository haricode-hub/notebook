[project]
name = "opennotebook-studio"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "httpx>=0.27", "aiosqlite>=0.20"]

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "apps/embed", "packages/core"]

[tool.uv.sources]
opennotebook-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["opennotebook_core", "opennotebook_api", "opennotebook_embed", "opennotebook_worker"]
mypy_path = ["packages/core/src", "apps/api/src", "apps/embed/src", "apps/worker/src"]

