[project]
name = "opennotebook-studio"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "hypothesis>=6.170.1",
    "reportlab>=5.0.1",
    "psutil>=7.2.2",
    "imageio-ffmpeg>=0.6.0",
]

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "apps/embed", "packages/core"]

[tool.uv.sources]
opennotebook-core = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest-tmp"
markers = ["slow: downloads and runs the real local EmbeddingGemma model"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["opennotebook_core", "opennotebook_api", "opennotebook_embed", "opennotebook_worker"]
mypy_path = ["packages/core/src", "apps/api/src", "apps/embed/src", "apps/worker/src"]

