[project]
name = "opennotebook-core"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.4",
    "redis>=5",
    "arq>=0.26",
    "litellm>=1.52",
    "httpx>=0.27",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "trafilatura>=2.3.1",
    "beautifulsoup4>=4.15.0",
    "aiohttp>=3.14.5",
    "cryptography>=50.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opennotebook_core"]
